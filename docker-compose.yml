networks:
  revProxy-net:
    external: true

secrets:
  db_password:
    file: secrets/db_password.txt
  secret_key:
    file: secrets/secret_key.txt
  openvpn_user:
    file: secrets/openvpn_user.txt
  openvpn_password:
    file: secrets/openvpn_password.txt
  # Gluetun's built-in HTTP proxy credential. It used to sit in envs/base.env,
  # which is committed; the port is only published inside the compose network,
  # but a password in git is a password in git. Same shape as the openvpn pair
  # above — gluetun reads any HTTPPROXY_* setting from a *_SECRETFILE variant.
  http_proxy_password:
    file: secrets/http_proxy_password.txt
  proxy_string:
    file: secrets/proxy_string.txt
  iwara_config:
    file: secrets/iwara.json
  # youtube_client_id:
  #   file: secrets/youtube_client_id.txt
  # youtube_client_secret:
  #   file: secrets/youtube_client_secret.txt
  # youtube_refresh_token:
  #   file: secrets/youtube_refresh_token.txt
  youtube_api_key:
    file: secrets/youtube_api_key.txt
  pg_admin_email:
    file: secrets/pg_admin_email.txt
  pg_admin_password:
    file: secrets/pg_admin_password.txt
  # Chat bot. All three of these must agree or the bot fails closed: this
  # definition, the `- bot_token` service reference, and BOT_TELEGRAM_TOKEN_FILE.
  # Mounting the secret is not enough — nothing reads it without the env var.
  # Comment all three out to run without a bot; a secret whose `file:` does not
  # exist makes `docker compose up` fail for the whole stack. See docs/BOT.md.
  bot_token:
    file: secrets/bot_token.txt

volumes:
  pgadmin-data:

services:
  yt-db:
    image: postgres:16-alpine
    container_name: yt-db
    # Published on a non-default host port so it cannot collide with another
    # project's postgres. Containers on revProxy-net still talk to 5432.
    # Host-side runs need DB_PORT to match the middle field.
    # Loopback-bound: this publish exists only so a host-side `deno task dev` on
    # the same machine can reach it. Nothing off-box should see the database.
    ports:
      - 127.0.0.1:${DB_HOST_PORT:-5433}:5432
    expose:
      - 5432
    restart: always
    secrets:
      - db_password
    networks:
      - revProxy-net
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME}
    # tmpfs:
    #   - /var/lib/postgresql/data
    volumes:
      - ${DB_LOCATION}:/var/lib/postgresql/data
    labels:
      # Watchtower monitoring
      - "com.centurylinklabs.watchtower.enable=true"
      # Autoheal
      - "autoheal.enable=true"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  yt-diff:
    # Pulled from CI-built GHCR image; Watchtower keeps it current
    # CI workflow: yt-diff/.github/workflows/docker-build-and-push.yml
    image: ghcr.io/sagnikdas53/yt-diff:latest
    container_name: yt-diff
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ${HOST_SAVE_PATH}
        target: ${CONTAINER_SAVE_PATH}
        read_only: false
      - type: bind
        source: ${HOST_COOKIES_FILE}
        target: ${CONTAINER_COOKIES_FILE}
        read_only: false # yt-dlp needs to write to this file, otherwise it fails
    depends_on:
      yt-db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - revProxy-net
    ports:
      - ${PORT}:${PORT}
    secrets:
      - db_password
      - secret_key
      - proxy_string
      - iwara_config
      # - youtube_client_id
      # - youtube_client_secret
      # - youtube_refresh_token
      - youtube_api_key
      - bot_token

    environment:
      - PROTOCOL=${PROTOCOL}
      - HOSTNAME=${HOSTNAME}
      - PORT=${PORT}
      - BASE_URL=${BASE_URL}
      - HIDE_PORTS=${HIDE_PORTS}
      - USE_NATIVE_HTTPS=${NATIVE_HTTPS_SUPPORT}
      - LOG_LEVELS=${LOG_LEVELS}
      - NO_COLOR=${NO_COLOR}
      # Database configuration
      - DB_HOST=${DB_HOST}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - SECRET_KEY_FILE=/run/secrets/secret_key
      # Download configuration
      - SAVE_PATH=${CONTAINER_SAVE_PATH}
      - SLEEP=${SLEEP}
      - CHUNK_SIZE_DEFAULT=${CHUNK_SIZE_DEFAULT}
      - SAVE_SUBTITLES=${SAVE_SUBTITLES}
      - SAVE_DESCRIPTION=${SAVE_DESCRIPTION}
      - SAVE_COMMENTS=${SAVE_COMMENTS}
      - SAVE_THUMBNAIL=${SAVE_THUMBNAIL}
      - RESTRICT_FILENAMES=${RESTRICT_FILENAMES}
      - MAX_FILENAME_LENGTH=${MAX_FILENAME_LENGTH}
      - X_COOKIES_FILE=${CONTAINER_COOKIES_FILE}
      - RATE_LIMIT_AUTH_BURST=${RATE_LIMIT_AUTH_BURST}
      - RATE_LIMIT_AUTH_REFILL=${RATE_LIMIT_AUTH_REFILL}
      - RATE_LIMIT_AUTH_PERIOD_SEC=${RATE_LIMIT_AUTH_PERIOD_SEC}
      - RATE_LIMIT_PUBLIC_BURST=${RATE_LIMIT_PUBLIC_BURST}
      - RATE_LIMIT_PUBLIC_REFILL=${RATE_LIMIT_PUBLIC_REFILL}
      - RATE_LIMIT_PUBLIC_PERIOD_SEC=${RATE_LIMIT_PUBLIC_PERIOD_SEC}
      - RATE_LIMIT_ACTION_BURST=${RATE_LIMIT_ACTION_BURST}
      - RATE_LIMIT_ACTION_REFILL=${RATE_LIMIT_ACTION_REFILL}
      - RATE_LIMIT_ACTION_PERIOD_SEC=${RATE_LIMIT_ACTION_PERIOD_SEC}
      - RATE_LIMIT_WORK_BURST=${RATE_LIMIT_WORK_BURST}
      - RATE_LIMIT_WORK_REFILL=${RATE_LIMIT_WORK_REFILL}
      - RATE_LIMIT_WORK_PERIOD_SEC=${RATE_LIMIT_WORK_PERIOD_SEC}
      - RATE_LIMIT_WEIGHT_BASE=${RATE_LIMIT_WEIGHT_BASE}
      - RATE_LIMIT_WEIGHT_LIST_FULL=${RATE_LIMIT_WEIGHT_LIST_FULL}
      - RATE_LIMIT_WEIGHT_LIST_INCREMENTAL=${RATE_LIMIT_WEIGHT_LIST_INCREMENTAL}
      - RATE_LIMIT_WEIGHT_DOWNLOAD=${RATE_LIMIT_WEIGHT_DOWNLOAD}
      - CACHE_MAX_ITEMS=${CACHE_MAX_ITEMS}
      - CACHE_MAX_AGE=${CACHE_MAX_AGE}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION}
      - MAX_USERS=${MAX_USERS}
      - MAX_DOWNLOADS=${MAX_DOWNLOADS}
      - MAX_LISTINGS=${MAX_LISTINGS}
      - CLEANUP_INTERVAL=${CLEANUP_INTERVAL}
      - PROCESS_MAX_AGE=${PROCESS_MAX_AGE}
      # Update configuration
      - TZ_PREFERRED=${TZ_PREFERRED}
      - UPDATE_SCHEDULED=${UPDATE_SCHEDULED}
      - PRUNE_INTERVAL=${PRUNE_INTERVAL}
      # Proxy Info
      - PROXY_STRING_FILE=/run/secrets/proxy_string
      # - PROXY_STRING=http://${HTTP_PROXY_USER}:${HTTP_PROXY_PASSWORD}@gluetun:3128
      # Redis Configuration
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      # Iwara Configuration
      - IWARA_CONF_FILE=/run/secrets/iwara_config
      # Youtube Configuration
      # - YOUTUBE_CLIENT_ID_FILE=/run/secrets/youtube_client_id
      # - YOUTUBE_CLIENT_SECRET_FILE=/run/secrets/youtube_client_secret
      # - YOUTUBE_REFRESH_TOKEN_FILE=/run/secrets/youtube_refresh_token
      - YOUTUBE_API_KEY_FILE=/run/secrets/youtube_api_key
      # Chat bot. Fails closed: with BOT_ENABLED=true and an empty
      # BOT_ALLOWED_CHAT_IDS the bot logs an error and starts nothing.
      # x.com cookies reach the bot through X_COOKIES_FILE above, since every
      # download and listing goes through the same buildSiteArgs.
      - BOT_ENABLED=${BOT_ENABLED:-false}
      - BOT_TELEGRAM_TOKEN_FILE=/run/secrets/bot_token
      - BOT_ALLOWED_CHAT_IDS=${BOT_ALLOWED_CHAT_IDS:-}
      # Optional. Empty means "use the origin the server logs at startup".
      # Set it only when HOSTNAME is not reachable from a chat client.
      # - BOT_PUBLIC_BASE_URL=${BOT_PUBLIC_BASE_URL:-}
      - BOT_RETENTION_MODE=${BOT_RETENTION_MODE:-ephemeral}
      # - BOT_RETENTION_HOURS=${BOT_RETENTION_HOURS:-24}
      # - BOT_REAP_INTERVAL=${BOT_REAP_INTERVAL:-0 * * * *}
      - BOT_TELEGRAM_MAX_UPLOAD=${BOT_TELEGRAM_MAX_UPLOAD:-50000000}
      - BOT_MAX_PENDING_PER_CHAT=${BOT_MAX_PENDING_PER_CHAT:-5}
      - BOT_LARGE_FILE_WARN=${BOT_LARGE_FILE_WARN:-104857600}

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ytdiff.entryPoints=web,websecure"
      - "traefik.http.routers.ytdiff.rule=Host(`${HOSTNAME}`) && PathPrefix(`${BASE_URL}`)"
      - "traefik.http.services.ytdiff.loadbalancer.server.port=${PORT}"
      - "traefik.http.services.ytdiff.loadBalancer.passHostHeader=true"
      - "traefik.http.routers.ytdiff.middlewares=http-to-https@docker"
      - "traefik.http.routers.ytdiff.tls=true"
      - "traefik.http.routers.ytdiff.tls.certresolver=tailsolver"
      - "traefik.http.routers.ytdiff.tls.domains[0].main=${HOSTNAME}"
      # Autoheal
      - "autoheal.enable=true"
      # Watchtower monitoring
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8888/ytdiff/ping" ]
      interval: 5m
      timeout: 5s
      start_period: 30s
      retries: 3

  valkey:
    image: valkey/valkey:9-alpine
    container_name: valkey
    restart: always
    networks:
      - revProxy-net
    # Non-default host port for the same reason as yt-db; host-side runs need
    # REDIS_PORT to match the middle field. Loopback-bound and not optional:
    # valkey runs with no password, so publishing it on 0.0.0.0 would hand
    # anyone on the LAN or tailnet the signed-URL store.
    ports:
      - 127.0.0.1:${REDIS_HOST_PORT:-6380}:6379
    expose:
      - 6379
    labels:
      - "autoheal.enable=true"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  pgbackups:
    container_name: pgbackups
    image: prodrigestivill/postgres-backup-local:18-debian-d257e5d
    restart: always
    volumes:
      - type: bind
        source: ${DB_BACKUP_LOCATION}
        target: /backups
    links:
      - yt-db
    depends_on:
      yt-db:
        condition: service_healthy
    secrets:
      - db_password
    networks:
      - revProxy-net
    environment:
      - BACKUP_ON_START=TRUE
      - POSTGRES_HOST=yt-db
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_EXTRA_OPTS=-Z1 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - HEALTHCHECK_PORT=8080
    # This won't be needing any labels as it's not going to be updated automatically by Watchtower
    # and since it's healthchecks keep failing autoheal is not needed either, nither is traefik monitoring

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin4
    restart: always
    ports:
      - "8686:80"
    secrets:
      - pg_admin_email
      - pg_admin_password
    environment:
      PGADMIN_DEFAULT_EMAIL_FILE: /run/secrets/pg_admin_email
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pg_admin_password
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      yt-db:
        condition: service_healthy
    networks:
      - revProxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.entryPoints=web,websecure"
      - "traefik.http.routers.pgadmin.rule=Host(`${HOSTNAME}`) && PathPrefix(`/pgadmin`)"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "traefik.http.services.pgadmin.loadBalancer.passHostHeader=true"
      - "traefik.http.routers.pgadmin.middlewares=http-to-https@docker"
      - "traefik.http.routers.pgadmin.tls=true"
      - "traefik.http.routers.pgadmin.tls.certresolver=tailsolver"
      - "traefik.http.routers.pgadmin.tls.domains[0].main=${HOSTNAME}"
      # Autoheal
      - "autoheal.enable=true"
      # Watchtower monitoring
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: [ "CMD", "wget", "-O", "-", "http://localhost:80/pgadmin/misc/ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    networks:
      - revProxy-net
    cap_add:
      - NET_ADMIN
    secrets:
      - openvpn_user
      - openvpn_password
      - http_proxy_password
    environment:
      - VPN_SERVICE_PROVIDER=${SERVICE_PROVIDER_VPN}
      - VPN_TYPE=openvpn
      - OPENVPN_USER_SECRETFILE=/run/secrets/openvpn_user
      - OPENVPN_PASSWORD_SECRETFILE=/run/secrets/openvpn_password
      - SERVER_COUNTRIES=${SERVER_COUNTRIES_PREFERRED}
      - FREE_ONLY=${FREE}
      - Tz=${TZ_PREFERRED}
      - HTTPPROXY=${HTTP_PROXY}
      - HTTPPROXY_LISTENING_ADDRESS=${HTTP_PROXY_LISTENING_ADDRESS}
      - HTTPPROXY_STEALTH=${HTTP_PROXY_STEALTH}
      - HTTPPROXY_USER=${HTTP_PROXY_USER}
      - HTTPPROXY_PASSWORD_SECRETFILE=/run/secrets/http_proxy_password
      # The proxy string is basically
      #- http://${HTTP_PROXY_USER}:<password>@gluetun:3128
      # yt-diff reads that whole string from secrets/proxy_string.txt via
      # PROXY_STRING_FILE, so the password is written in two places and they
      # have to agree.
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./gluetun:/gluetun
    restart: "unless-stopped"
    ports:
      - 51413:51413
      - 51413:51413/udp
      - 3128:3128 # <- Enable to use outside of the docker network
    labels:
      # Autoheal
      - "autoheal.enable=true"
      # Watchtower monitoring
      - "com.centurylinklabs.watchtower.enable=true"
