version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # No npm ecosystem here. The backend is Deno and declares its dependencies in
  # deno.json / deno.lock, which Dependabot does not support. The only real
  # package.json belongs to the `frontend` git submodule and is updated in that
  # repository, not this one.
  #
  # This block used to point at a root package.json containing `{}`, which made
  # Dependabot report the project as npm-with-no-dependencies.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
