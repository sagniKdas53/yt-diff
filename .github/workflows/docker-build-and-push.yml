name: Build and Push Nix Image

on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      version:
        description: "Semver without a leading v"
        type: string
        required: true
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: purevert/yt-diff

concurrency:
  group: nix-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} with Nix
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            arch: amd64
            runner: ubuntu-24.04
          - system: aarch64-linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable OCI archive
        run: |
          nix build --print-build-logs ".#packages.${{ matrix.system }}.container"
          cp -L result "yt-diff-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: yt-diff-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: image-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: purevert
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tags="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            tags="$tags latest master main"
          fi
          if [[ -n "$VERSION" ]]; then
            tags="$tags $VERSION ${VERSION%.*} ${VERSION%%.*}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Push architecture images and manifests
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          staging="sha-${GITHUB_SHA::7}"
          for registry in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for arch in amd64 arm64; do
              skopeo copy --retry-times 3 \
                "docker-archive:yt-diff-$arch.tar.gz" \
                "docker://$registry:$staging-$arch"
            done
            for tag in $TAGS; do
              docker buildx imagetools create \
                --tag "$registry:$tag" \
                "$registry:$staging-amd64" "$registry:$staging-arm64"
            done
          done
