name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # The signals the repo already had and nothing gated. Cheapest job in the
  # file and the first to fail, so a type error or a lint hit does not wait
  # out the container build behind it.
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Each runs even when an earlier one fails: one push should surface every
      # problem, not the first alphabetically.
      - name: Type Check
        run: deno task check

      - name: Lint
        if: always()
        run: deno task lint

      - name: Format Check
        if: always()
        run: deno task fmt:check

  # Runs before the E2E suite because it is the cheap half: no Docker, no
  # database, seconds rather than minutes.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Unit Tests
        run: deno test --allow-read --allow-write --allow-env --junit-path=unit_test_results.xml tests/

      - name: Parse Test Results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test Results
          path: unit_test_results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: unit_test_results.xml

  # The frontend submodule carries its own eslint config and vitest suite;
  # both were advisory until now.
  frontend-tests:
    name: Frontend Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        id: install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Runs whichever way lint went -- same reason as Static Checks -- but not
      # when the install itself failed, where there is nothing to test.
      # Reported through the same JUnit path as the other two suites.
      - name: Run Unit Tests
        if: steps.install.outcome == 'success'
        working-directory: frontend
        run: npx vitest run --reporter=junit --outputFile=frontend_test_results.xml

      - name: Parse Test Results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Frontend Test Results
          path: frontend/frontend_test_results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: frontend/frontend_test_results.xml

  e2e-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create Reports Directory
        run: mkdir -p validation/reports && chmod 777 validation/reports

      - name: Run E2E Tests
        working-directory: validation
        run: ./run_tests.sh

      - name: Capture Logs on Failure
        if: failure()
        working-directory: validation
        run: docker compose -f docker-compose.test.yml logs > service_logs.txt

      - name: Parse Test Results
        if: always()
        id: test-results
        uses: dorny/test-reporter@v3
        with:
          name: E2E Test Results
          path: validation/reports/test_results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Generate Test Report Summary
        if: always()
        run: |
          if [ -f validation/reports/test_results.xml ]; then
            # Parse XML to extract test counts
            PASSED=$(grep -o 'tests="[^"]*"' validation/reports/test_results.xml | head -1 | cut -d'"' -f2)
            FAILED=$(grep -o 'failures="[^"]*"' validation/reports/test_results.xml | head -1 | cut -d'"' -f2)
            SKIPPED=$(grep -o 'skipped="[^"]*"' validation/reports/test_results.xml | head -1 | cut -d'"' -f2)
            
            # Set defaults if not found
            PASSED=${PASSED:-0}
            FAILED=${FAILED:-0}
            SKIPPED=${SKIPPED:-0}
            
            TOTAL=$((PASSED + FAILED))
            
            if [ "$TOTAL" -gt 0 ]; then
              PASS_PERCENT=$((PASSED * 100 / TOTAL))
              FAIL_PERCENT=$((FAILED * 100 / TOTAL))
            else
              PASS_PERCENT=0
              FAIL_PERCENT=0
            fi
            
            echo "## 📊 Test Report Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count | Percentage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|------------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED | $PASS_PERCENT% |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED | $FAIL_PERCENT% |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️  Skipped | $SKIPPED | - |" >> $GITHUB_STEP_SUMMARY
            echo "| 📈 Total | $TOTAL | 100% |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Status" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILED" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
            elif [ "$TOTAL" -eq 0 ]; then
              echo "⚠️ No tests found" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: validation/reports/test_results.xml

      - name: Upload Service Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: service-logs
          path: validation/service_logs.txt

      - name: Fail if tests failed
        if: failure() || steps.test-results.outcome == 'failure'
        run: exit 1
